[project]
name = "erpnext_amazon_business"
authors = [{ name = "CorpDK", email = "ops@corpdk.local" }]
description = "Amazon Business buyer sync, purchase register, and ERPNext Purchase Invoice reconciliation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { text = "GPL-3.0-or-later" }

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.bench.dev-dependencies]
erpnext_amazon_business = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["W191"]
