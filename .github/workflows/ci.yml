name: CI

on:
  push:
    branches: [main, "fm/**", "bb/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check erpnext_amazon_business tests

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  migrate:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Migrate against bench (skeleton)
        run: |
          echo "P0 CI skeleton: wire bench get-app + bench migrate on a v16 site in follow-up."
          echo "DocTypes ship as JSON; local validation is ruff + catalog unit tests above."
